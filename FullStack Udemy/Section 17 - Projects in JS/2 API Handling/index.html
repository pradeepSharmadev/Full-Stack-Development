<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Api Handling</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1 id="weather">Weather App</h1>
      <div class="inputSection">
        <input type="text" id="city" placeholder="Enter City Name" />
        <button id="getWeather">Get Weather</button>
      </div>
      <div id="weatherDescription" class="weatherInfo">
        <h2 id="cityName"></h2>
        <p id="temperatur"></p>
        <p id="info"></p>
      </div>
      <div class="error">
        <p class="" id="errorMessage">City Not Found! Try Again!!</p>
      </div>
    </div>

    <script src="scripts.js">
      
    </script>
  </body>
</html>
