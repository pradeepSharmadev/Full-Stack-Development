<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Commerce Add To Cart</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Top Navbar -->
    <div class="navbar">
      <h1>E-Commerce Site</h1>
    </div>
    <div class="mainContainer">
      <!-- Items Section -->
      <div class="box box1">
        <h2 class="nameSection">Available Items</h2>
        <div id="items-container" class="items-container"></div>
      </div>
      <!-- Total Calculation Section -->
      <div class="box">
        <h2 class="nameSection">Cart Section</h2>
        <div id="containerCart">
          <div id="main">
          </div>

          <div class="totle">
            Total Price $<span id="totalAmount">0.0</span>
          </div>
          <button id="checkOut">Order Now</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
