<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Commerce Add to Cart</title>
    <style>
      /* Body Styling with Animated Background */
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(120deg, #ff9a9e, #fad0c4, #fbc2eb, #a1c4fd);
        background-size: 400% 400%;
        animation: gradientAnimation 8s ease infinite;
        color: #333;
        overflow: hidden;
      }

      /* Navbar Styling */
      .navbar {
        background: rgba(255, 255, 255, 0.01);
        backdrop-filter: blur(10px);
        text-align: center;
        padding: 10px;
        position: sticky;
        top: 0;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        z-index: 2;
      }

      .navbar h1 {
        margin: 0;
        font-size: 24px;
        color: #4a90e2;
      }

      /* Item Container Styling */
      .items-container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        padding: 20px;
        position: relative;
        z-index: 2;
      }

      .item {
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 12px;
        padding: 15px;
        width: 200px;
        text-align: center;
        background: rgba(255, 255, 255, 0.8);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      .item:hover {
        transform: translateY(-5px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
      }

      .item img {
        width: 100%;
        border-radius: 8px;
      }

      .item h3 {
        font-size: 16px;
        color: #4a90e2;
        margin: 10px 0;
      }

      .item p {
        font-size: 14px;
        color: #666;
      }

      .item button {
        background: #4a90e2;
        color: white;
        padding: 10px;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.3s ease;
        transition: transform 0.3s ease;
      }

      .item button:hover {
        background: #357abd;
        transform: scale(1.1);
      }

      /* Total Section Styling */
      .total-section {
        text-align: center;
        padding: 20px;
        margin-top: 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.5);
        background: rgba(255, 255, 255, 0.001);
        backdrop-filter: blur(10px);
      }

      .total-section h2 {
        margin: 0;
        color: #4a90e2;
      }

      .total-section p {
        font-size: 18px;
        font-weight: bold;
      }

      /* Background Shapes */
      .shape {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(15px);
        animation: moveShapes 60s ease infinite;
        z-index: 1;
      }

      .shape1 {
        width: 120px;
        height: 3px;
        top: 20%;
        left: 4%;
      }
      .shape4 {
        width: 20px;
        height: 200px;
        top: 20%;
        left: 4%;
      }

      .shape2 {
        width: 20px;
        height: 200px;
        top: 66%;
        left: 30%;
      }

      .shape3 {
        width: 120px;
        height: 12px;
        bottom: 15%;
        left: 30%;
      }

      /* Animation for Shapes */
      @keyframes moveShapes {
        0% {
          transform: translate(0, 0) rotate(0deg);
        }
        25% {
          transform: translate(50vw, -20vh) rotate(90deg);
        }
        50% {
          transform: translate(-30vw, 30vh) rotate(180deg);
        }
        75% {
          transform: translate(40vw, 20vh) rotate(270deg);
        }
        100% {
          transform: translate(0, 0) rotate(360deg);
        }
      }
      /* Gradient Animation */
      @keyframes gradientAnimation {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
    </style>
  </head>
  <body>
    <!-- Top Navbar -->
    <div class="navbar">
      <h1>E-Commerce Site</h1>
    </div>

    <!-- Background Shapes -->
    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>
    <div class="shape shape4"></div>

    <!-- Items Section -->
    <div class="items-container">
      <!-- Item 1 -->
      <div class="item">
        <img src="https://via.placeholder.com/150" alt="Item 1" />
        <h3>Item 1</h3>
        <p>Price: $10</p>
        <button onclick="addToCart(10)">Add to Cart</button>
      </div>
      <!-- Item 2 -->
      <div class="item">
        <img src="https://via.placeholder.com/150" alt="Item 2" />
        <h3>Item 2</h3>
        <p>Price: $15</p>
        <button onclick="addToCart(15)">Add to Cart</button>
      </div>
      <!-- Item 3 -->
      <div class="item">
        <img src="https://via.placeholder.com/150" alt="Item 3" />
        <h3>Item 3</h3>
        <p>Price: $20</p>
        <button onclick="addToCart(20)">Add to Cart</button>
      </div>
    </div>

    <!-- Total Calculation Section -->
    <div class="total-section">
      <h2>Total Amount</h2>
      <p id="totalAmount">$0</p>
    </div>

    <!-- Inline JavaScript -->
    <script>
      let total = 0;
      function addToCart(price) {
        total += price;
        document.getElementById("totalAmount").innerText = `$${total}`;
      }
    </script>
  </body>
</html>
