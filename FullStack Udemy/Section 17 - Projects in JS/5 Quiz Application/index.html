<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz-App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="main">
      <h2>Quiz-Application</h2>
      <div class="startQuizButtonContainer">
        <!-- select category of question and start quiz -->
        <div id="categoryContainer">
          <label for="category">Select Category:</label>
          <select name="category" id="category" class="category" required>
            <option value="Science">Science</option>
            <option value="Physics">Physics</option>
            <option value="Computer-Science">Computer Science</option>
            <option value="Mathematics">Mathematics</option>
          </select>
        </div>
        <button id="startQuiz" class="startQuizButton" class="hidden">
          Start Quiz
        </button>
      </div>
      <div id="questionsContainer" class="questionsContainer hidden"></div>
      <div id="scoreContainer" class="scoreContainer hidden"></div>
    </div>
    <!-- <script type="module" src="data.js"></script> type="module" states that this is a module so export import allowed in ES6 Javascript in latest Browser -->
    <script type="module" src="data.js"></script>
    <script type="module" src="scripts.js"></script>
  </body>
</html>
