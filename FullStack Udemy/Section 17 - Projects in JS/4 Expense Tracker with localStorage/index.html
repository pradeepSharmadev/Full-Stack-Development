<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="mainContainer">
        <h2>Expense Tracker</h2>
        <form action="" id="form" class="form">
            <label for="category">Category:</label>
            <input id="category" type="text" placeholder="Traveling Around..." value="">
            <label for="category">Amount:</label>
            <input id="expenseAmount" type="text" placeholder="$100.00" value="">
            <button id="btn">Add Expense</button>
        </form>
        <h4>Tracker-List</h4>
        <div id="container" class="container">
        </div>
        <div class="totalAmount">
            Total Amount: $<span id="totalAmount"></span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
